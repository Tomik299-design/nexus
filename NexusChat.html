<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusChat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg-void: #070809;
    --bg-deep: #0d0f11;
    --bg-surface: #13161a;
    --bg-raised: #1a1e24;
    --bg-hover: #21262e;
    --bg-active: #262c35;
    --border: #1e242c;
    --border-bright: #2a3240;
    --accent: #4fffb0;
    --accent-dim: #1a4d38;
    --accent-glow: rgba(79,255,176,0.15);
    --accent2: #7c6aff;
    --accent2-dim: rgba(124,106,255,0.15);
    --red: #ff4f6a;
    --red-dim: rgba(255,79,106,0.15);
    --yellow: #ffc94f;
    --text-primary: #e8edf3;
    --text-secondary: #7a8899;
    --text-muted: #424e5c;
    --online: #4fffb0;
    --idle: #ffc94f;
    --dnd: #ff4f6a;
    --offline: #424e5c;
    --sidebar-w: 220px;
    --channels-w: 200px;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'Syne', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --transition: 120ms ease;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  
  html, body {
    width:100%; height:100%;
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 14px;
    overflow: hidden;
  }

  /* ── LAYOUT ── */
  #app { display:flex; width:100%; height:100%; }

  /* ── SERVER SIDEBAR ── */
  #servers {
    width: 60px;
    min-width: 60px;
    height: 100%;
    background: var(--bg-void);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    gap: 6px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  #servers::-webkit-scrollbar { display:none; }

  .server-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--bg-raised);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-secondary);
    transition: border-radius var(--transition), background var(--transition), color var(--transition);
    position: relative;
    flex-shrink: 0;
    user-select: none;
    border: 2px solid transparent;
    letter-spacing: -0.3px;
  }
  .server-icon:hover, .server-icon.active {
    border-radius: var(--radius);
    background: var(--accent-dim);
    color: var(--accent);
    border-color: var(--accent);
  }
  .server-icon .notif-badge {
    position: absolute;
    bottom: -2px; right: -2px;
    width: 14px; height: 14px;
    background: var(--red);
    border-radius: 50%;
    border: 2px solid var(--bg-void);
    font-size: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 700;
  }
  .server-sep {
    width: 28px; height: 2px;
    background: var(--border-bright);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .server-add {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px dashed var(--border-bright);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 20px;
    transition: all var(--transition);
    flex-shrink: 0;
  }
  .server-add:hover {
    border-color: var(--accent);
    color: var(--accent);
    border-radius: var(--radius);
    background: var(--accent-dim);
  }

  /* ── CHANNEL SIDEBAR ── */
  #channels {
    width: var(--channels-w);
    min-width: var(--channels-w);
    height: 100%;
    background: var(--bg-deep);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
  }

  #server-header {
    padding: 0 12px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    background: var(--bg-deep);
  }
  #server-header:hover { background: var(--bg-hover); }
  #server-header .name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #server-header .arrow {
    color: var(--text-secondary);
    font-size: 12px;
    flex-shrink: 0;
  }

  #channel-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--bg-active) transparent;
  }
  #channel-list::-webkit-scrollbar { width: 4px; }
  #channel-list::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 4px; }

  .channel-category {
    padding: 14px 12px 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }
  .channel-category:hover { color: var(--text-secondary); }
  .channel-category .cat-arrow { font-size: 9px; transition: transform var(--transition); }

  .channel-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px 5px 12px;
    margin: 0 6px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    transition: background var(--transition), color var(--transition);
    user-select: none;
    position: relative;
  }
  .channel-item:hover { background: var(--bg-hover); color: var(--text-secondary); }
  .channel-item.active { background: var(--bg-active); color: var(--text-primary); }
  .channel-item .ch-icon { font-size: 14px; flex-shrink: 0; opacity: 0.7; }
  .channel-item .ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .channel-item .ch-unread {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .channel-item .ch-notif {
    background: var(--red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* user panel */
  #user-panel {
    height: 50px;
    background: var(--bg-void);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 6px;
    flex-shrink: 0;
  }
  #user-panel .avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    color: var(--bg-void);
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
  }
  #user-panel .avatar .status-dot {
    position: absolute;
    bottom: -1px; right: -1px;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--bg-void);
    background: var(--online);
  }
  #user-panel .user-info {
    flex: 1;
    overflow: hidden;
  }
  #user-panel .user-info .uname {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  #user-panel .user-info .utag {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono);
    line-height: 1.2;
  }
  #user-panel .panel-btns {
    display: flex;
    gap: 2px;
  }
  #user-panel .panel-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  #user-panel .panel-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  #user-panel .panel-btn.active { color: var(--red); }

  /* ── MAIN CHAT ── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-surface);
  }

  /* chat header */
  #chat-header {
    height: 46px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    background: var(--bg-surface);
    flex-shrink: 0;
  }
  #chat-header .ch-icon-big { font-size: 18px; color: var(--text-muted); }
  #chat-header .ch-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }
  #chat-header .ch-desc {
    font-size: 12px;
    color: var(--text-muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 10px;
    border-left: 1px solid var(--border);
    margin-left: 4px;
  }
  #chat-header .header-btns {
    display: flex;
    gap: 2px;
    margin-left: auto;
  }
  #chat-header .hbtn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  #chat-header .hbtn:hover { background: var(--bg-hover); color: var(--text-primary); }
  #chat-header .hbtn.active { color: var(--accent); }

  /* messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 0 0;
    display: flex;
    flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: var(--bg-active) transparent;
    contain: strict;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 4px; }

  /* system msg */
  .system-msg {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    margin: 4px 0;
  }
  .system-msg::before, .system-msg::after {
    content:'';
    flex:1;
    height:1px;
    background: var(--border);
  }
  .system-msg span {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    padding: 0 6px;
  }

  /* message group */
  .msg-group {
    display: flex;
    flex-direction: column;
    padding: 2px 0;
    contain: layout;
  }
  .msg-group:hover > .msg-row > .msg-meta > .msg-ts { opacity: 1; }

  .msg-row {
    display: flex;
    align-items: flex-start;
    padding: 1px 16px 1px 14px;
    gap: 12px;
    position: relative;
    border-left: 2px solid transparent;
    transition: background var(--transition), border-color var(--transition);
    contain: layout;
  }
  .msg-row:hover {
    background: var(--bg-raised);
  }
  .msg-row.first-in-group { padding-top: 10px; }

  .msg-row .avatar-wrap {
    width: 36px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .msg-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: var(--bg-void);
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }
  .msg-avatar:hover { filter: brightness(1.1); }

  .msg-ts-compact {
    width: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 2px;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .msg-row:hover .msg-ts-compact { opacity: 1; }
  .msg-ts-compact span {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono);
    white-space: nowrap;
  }

  .msg-content-wrap { flex: 1; min-width: 0; }

  .msg-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .msg-author {
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .msg-author:hover { text-decoration: underline; }
  .msg-ts {
    font-size: 10px;
    color: var(--text-muted);
    font-family: var(--mono);
    opacity: 0.7;
    transition: opacity var(--transition);
  }
  .msg-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge-bot { background: var(--accent2-dim); color: var(--accent2); }
  .badge-mod { background: var(--accent-dim); color: var(--accent); }

  .msg-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-primary);
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg-text code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg-void);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--accent);
  }
  .msg-text .mention {
    color: var(--accent2);
    background: var(--accent2-dim);
    padding: 0 3px;
    border-radius: 3px;
    cursor: pointer;
    font-weight: 600;
  }
  .msg-text .mention:hover { background: rgba(124,106,255,0.3); }

  /* reactions */
  .msg-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  .reaction {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
    cursor: pointer;
    font-size: 12px;
    transition: background var(--transition), border-color var(--transition);
    user-select: none;
  }
  .reaction:hover { background: var(--bg-hover); border-color: var(--accent); }
  .reaction.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .reaction .emoji { font-size: 14px; }
  .reaction .count { font-weight: 700; color: var(--text-secondary); font-size: 11px; font-family: var(--mono); }
  .reaction.active .count { color: var(--accent); }

  /* image embed */
  .msg-image {
    margin-top: 6px;
    border-radius: var(--radius);
    overflow: hidden;
    max-width: 380px;
  }
  .msg-image img {
    max-width: 100%;
    display: block;
    border-radius: var(--radius);
  }

  /* link embed */
  .embed {
    margin-top: 6px;
    border-left: 3px solid var(--accent2);
    background: var(--bg-raised);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 8px 10px;
    max-width: 380px;
  }
  .embed .embed-site { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .embed .embed-title { font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 3px; }
  .embed .embed-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

  /* action bar on hover */
  .msg-actions {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    gap: 2px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    z-index: 10;
  }
  .msg-row:hover .msg-actions { display: flex; }
  .action-btn {
    width: 26px; height: 26px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .action-btn.red:hover { background: var(--red-dim); color: var(--red); }

  /* pinned msg highlight */
  .msg-row.pinned { border-left-color: var(--yellow); }

  /* typing indicator */
  #typing-bar {
    height: 22px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .typing-dots {
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .typing-dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typingPulse 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingPulse {
    0%,60%,100% { transform: scale(1); opacity:0.4; }
    30% { transform: scale(1.3); opacity:1; }
  }
  #typing-bar .typing-text {
    font-size: 11px;
    color: var(--text-muted);
  }
  #typing-bar .typing-text strong { color: var(--text-secondary); }

  /* ── INPUT BAR ── */
  #input-area {
    padding: 0 14px 14px;
    flex-shrink: 0;
  }
  #input-box {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 6px 8px;
    transition: border-color 150ms ease;
  }
  #input-box:focus-within {
    border-color: var(--border-bright);
  }
  .input-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 17px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
    flex-shrink: 0;
  }
  .input-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  #msg-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 13.5px;
    resize: none;
    max-height: 180px;
    min-height: 20px;
    line-height: 1.5;
    padding: 6px 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--bg-active) transparent;
  }
  #msg-input::placeholder { color: var(--text-muted); }
  #send-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--bg-void);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), transform var(--transition);
    flex-shrink: 0;
    font-weight: 700;
  }
  #send-btn:hover { background: #5fffb8; transform: scale(1.05); }
  #send-btn:active { transform: scale(0.95); }

  /* ── MEMBERS SIDEBAR ── */
  #members {
    width: 220px;
    min-width: 220px;
    height: 100%;
    background: var(--bg-deep);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 200ms ease, min-width 200ms ease, opacity 200ms ease;
  }
  #members.hidden { width: 0; min-width: 0; opacity: 0; }
  #members-header {
    padding: 0 12px;
    height: 46px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #members-header span {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  #member-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--bg-active) transparent;
  }
  #member-list::-webkit-scrollbar { width: 4px; }
  #member-list::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 4px; }

  .member-category {
    padding: 12px 12px 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .member-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    margin: 0 4px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background var(--transition);
    user-select: none;
  }
  .member-item:hover { background: var(--bg-hover); }
  .member-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    color: var(--bg-void);
    position: relative;
    flex-shrink: 0;
  }
  .member-avatar .m-status {
    position: absolute;
    bottom: -1px; right: -1px;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--bg-deep);
  }
  .m-online { background: var(--online); }
  .m-idle { background: var(--idle); }
  .m-dnd { background: var(--dnd); }
  .m-offline { background: var(--offline); opacity: 0.5; }
  .member-info { flex: 1; overflow: hidden; }
  .member-name {

    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: 300px;
  }
  #emoji-picker.open { display: flex; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 2px;
  }
  .emoji-btn {
    width: 30px; height: 30px;
    border-radius: 6px;
    border: none;
    background: transparent;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;

    line-height: 1;

  .emoji-search {
    background: var(--bg-surface);

  /* ── CONTEXT MENU ── */
  #ctx-menu {

    display: flex;
    align-items: center;
    gap: 8px;

    color: var(--text-secondary);
    transition: background var(--transition), color var(--transition);

  .ctx-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .ctx-item.danger { color: var(--red); }

  .ctx-item.success { color: var(--accent); }
  .ctx-item.success:hover { background: var(--accent-dim); }
  .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }
  .ctx-icon { font-size: 14px; width: 16px; text-align: center; }

  /* ── TOAST ── */
  #toast-container {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 999;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-primary);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    animation: toastIn 200ms ease, toastOut 200ms ease 2.8s forwards;
    max-width: 300px;
  }
  .toast.success { border-left: 3px solid var(--accent); }
  .toast.error { border-left: 3px solid var(--red); }
  .toast.info { border-left: 3px solid var(--accent2); }
  @keyframes toastIn { from { transform: translateX(20px); opacity:0; } to { transform: translateX(0); opacity:1; } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; pointer-events:none; } }

  /* ── MODAL ── */
  #modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);

    display: none;
    align-items: center;
    justify-content: center;

  #modal-overlay.open { display: flex; }
  #modal {
    background: var(--bg-raised);
    border: 1px solid var(--border);

    padding: 22px;
    width: min(420px, 90vw);
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);

  }
  @keyframes modalIn { from { transform: scale(0.95); opacity:0; } to { transform: scale(1); opacity:1; } }
  #modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  #modal .field { margin-bottom: 14px; }
  #modal .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  #modal .field input, #modal .field textarea {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 13px;
    outline: none;

  #modal .field input:focus, #modal .field textarea:focus { border-color: var(--accent); }
  #modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  #modal .btn {
    padding: 8px 18px;
    border-radius: var(--radius);

    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;

    transition: opacity var(--transition);

  #modal .btn:hover { opacity: 0.85; }

  #modal .btn-ghost { background: var(--bg-hover); color: var(--text-secondary); }

  /* scrollbar body for messages */
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 4px; }

  /* mobile */
  @media (max-width: 768px) {
    #servers { width: 50px; min-width: 50px; }
    #channels { width: 160px; min-width: 160px; }
    #members { display: none; }
    .ch-desc { display: none; }
  }
  @media (max-width: 520px) {
    #channels { display: none; }
  }

  /* welcome screen */
  #welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);

  }

  #welcome h1 { font-size: 22px; font-weight: 800; color: var(--text-secondary); letter-spacing: -0.5px; }
  #welcome p { font-size: 13px; max-width: 260px; text-align: center; line-height: 1.6; }

  /* ── VOICE INDICATOR ── */
  .voice-row {

    align-items: center;
    gap: 6px;
    padding: 2px 16px 2px 24px;
  }
  .voice-avatar {
    width: 22px; height: 22px;

  /* search bar in header */

  /* Scroll to bottom btn */

    position: absolute;
    bottom: 80px;

  #scroll-btn:hover { background: var(--accent); color: var(--bg-void); border-color: var(--accent); }

  /* announce banner */
  .announce-banner {
    margin: 8px 16px;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent2-dim));
    border: 1px solid var(--border-bright);

    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .announce-banner strong { color: var(--accent); }
</style>

<body>

<div id="app">

  <!-- SERVER RAIL -->
  <div id="servers">
    <div class="server-icon active" data-server="nexus" onclick="switchServer('nexus',this)" title="Nexus Hub">NH</div>
    <div class="server-icon" data-server="gaming" onclick="switchServer('gaming',this)" title="Gaming Den">GD<span class="notif-badge">3</span></div>
    <div class="server-icon" data-server="dev" onclick="switchServer('dev',this)" title="Dev Squad">DS</div>
    <div class="server-icon" data-server="music" onclick="switchServer('music',this)" title="Music Lounge">ML</div>
    <div class="server-sep"></div>
    <div class="server-add" onclick="openNewServerModal()" title="Přidat server">+</div>
  </div>

  <!-- CHANNEL PANEL -->

    <div id="server-header">
      <span class="name" id="server-name">Nexus Hub</span>
      <span class="arrow">▾</span>
    </div>
    <div id="channel-list"></div>
    <div id="user-panel">
      <div class="avatar" id="my-avatar" title="Můj profil" onclick="showToast('Profil otevřen','info')">
        YO
        <div class="status-dot m-online"></div>
      </div>
      <div class="user-info">
        <div class="uname" id="my-uname">You</div>
        <div class="utag" id="my-tag">#0001</div>
      </div>
      <div class="panel-btns">
        <button class="panel-btn" id="mic-btn" title="Mikrofon" onclick="toggleMic(this)">🎤</button>
        <button class="panel-btn" id="deaf-btn" title="Sluchátka" onclick="toggleDeaf(this)">🎧</button>
        <button class="panel-btn" title="Nastavení" onclick="openSettings()">⚙️</button>
      </div>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div id="main">

    <!-- CHAT HEADER -->
    <div id="chat-header">
      <span class="ch-icon-big" id="hdr-icon">#</span>
      <span class="ch-title" id="hdr-title">obecný</span>
      <span class="ch-desc" id="hdr-desc">Hlavní chat · Vítejte v NexusChat!</span>
      <div class="header-btns">
        <input id="search-box" placeholder="🔍  Hledat..." oninput="searchMessages(this.value)" />
        <button class="hbtn active" id="members-btn" title="Členové" onclick="toggleMembers()">👥</button>
        <button class="hbtn" title="Připnout" onclick="showToast('Připnuté zprávy','info')">📌</button>
        <button class="hbtn" title="Nápověda" onclick="showToast('NexusChat v1.0','info')">❓</button>
      </div>
    </div>

    <!-- MESSAGES -->
    <div id="messages" onscroll="onMessagesScroll()"></div>

    <!-- TYPING -->

    <!-- INPUT -->

      <div id="input-box">
        <button class="input-btn" title="Přidat soubor" onclick="showToast('Nahrávání souborů','info')">📎</button>
        <textarea id="msg-input" placeholder="Zpráva do #obecný" rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this); handleTyping()"></textarea>
        <button class="input-btn" title="Emoji" onclick="toggleEmoji()">😊</button>

  <!-- MEMBERS -->

    <div id="members-header">
      <span>Členové — <span id="member-count">0</span></span>

    <div id="member-list"></div>

</div>

<!-- SCROLL BTN -->

<!-- EMOJI PICKER -->

</div>

<!-- CONTEXT MENU -->

<!-- TOAST -->
<div id="toast-container"></div>

<!-- MODAL -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  NexusChat — full client-side chat app
// ═══════════════════════════════════════════════════════════════

const ME = { name: localStorage.getItem('nx_name') || 'You', tag: '#0001', color: '#7c6aff' };

// ── DATA ────────────────────────────────────────────────────────
const SERVERS = {
  nexus: {
    name: 'Nexus Hub',
    categories: [
      { name: 'Informace', channels: [
        { id:'pravidla', name:'pravidla', icon:'📜', desc:'Pravidla serveru', type:'text' },
        { id:'oznameni', name:'oznámení', icon:'📢', desc:'Důležitá oznámení', type:'text' }
      ]},
      { name: 'Obecné', channels: [
        { id:'obecny', name:'obecný', icon:'#', desc:'Hlavní chat · Vítejte!', type:'text' },
        { id:'media', name:'média', icon:'🖼️', desc:'Sdílení médií', type:'text' },
        { id:'offtopic', name:'off-topic', icon:'💬', desc:'Cokoliv jiného', type:'text' }
      ]},
      { name: 'Hlas', channels: [
        { id:'vc-lobby', name:'Lobby', icon:'🔊', desc:'Hlavní hlasový kanál', type:'voice' },
        { id:'vc-gaming', name:'Gaming', icon:'🎮', desc:'Herní session', type:'voice' }
      ]}
    ]
  },
  gaming: {
    name: 'Gaming Den',
    categories: [
      { name: 'Gaming', channels: [
        { id:'cs2', name:'cs2', icon:'🔫', desc:'Counter-Strike 2', type:'text' },
        { id:'minecraft', name:'minecraft', icon:'⛏️', desc:'Minecraft', type:'text' },
        { id:'valorant', name:'valorant', icon:'⚡', desc:'Valorant', type:'text' }
      ]},
      { name: 'Hlas', channels: [
        { id:'vc-team1', name:'Tým 1', icon:'🔊', desc:'', type:'voice' },
        { id:'vc-team2', name:'Tým 2', icon:'🔊', desc:'', type:'voice' }
      ]}
    ]
  },
  dev: {
    name: 'Dev Squad',
    categories: [
      { name: 'Dev', channels: [
        { id:'general-dev', name:'obecný', icon:'#', desc:'Obecné programování', type:'text' },
        { id:'javascript', name:'javascript', icon:'🟨', desc:'JS / TS', type:'text' },
        { id:'python', name:'python', icon:'🐍', desc:'Python', type:'text' },
        { id:'code-review', name:'code-review', icon:'👀', desc:'Kontrola kódu', type:'text' }
      ]}
    ]
  },
  music: {
    name: 'Music Lounge',
    categories: [
      { name: 'Hudba', channels: [
        { id:'music-chat', name:'chat', icon:'🎵', desc:'Hudební diskuse', type:'text' },
        { id:'music-share', name:'sdílení', icon:'🎶', desc:'Sdílej co posloucháš', type:'text' }
      ]},
      { name: 'Hlas', channels: [
        { id:'vc-music', name:'Hudební bot', icon:'🎵', desc:'', type:'voice' }
      ]}
    ]
  }
};

const MEMBERS = [
  { name:'Alex', tag:'#1337', color:'#4fffb0', status:'online', activity:'Hraje CS2', role:'admin' },
  { name:'Marina', tag:'#2048', color:'#7c6aff', status:'online', activity:'Poslouchá Spotify', role:'mod' },
  { name:'Tomáš', tag:'#0420', color:'#ff9f4f', status:'online', activity:'', role:'' },
  { name:'Kristýna', tag:'#9999', color:'#ff4f6a', status:'idle', activity:'Nečinný 15 min', role:'' },
  { name:'Pavel', tag:'#1111', color:'#4fc3ff', status:'dnd', activity:'Neobtěžovat', role:'' },
  { name:'Sara', tag:'#3141', color:'#c44fff', status:'online', activity:'Programuje', role:'' },
  { name:'Ondra', tag:'#2222', color:'#ffc94f', status:'offline', activity:'Byl online před 2h', role:'' },
  { name:'Lukáš', tag:'#5050', color:'#4fffb0', status:'offline', activity:'', role:'' },
];

const SEED_MESSAGES = {
  obecny: [
    { author:'Alex', color:'#4fffb0', badge:'mod', text:'Vítejte v NexusChat! 🎉 Tato aplikace je plně offline — žádné servery, žádné sledování.', ts: msAgo(120) },
    { author:'Marina', color:'#7c6aff', badge:'', text:'Super design! Líbí se mi jak to vypadá. Mnohem lepší než Discord 👀', ts: msAgo(118) },
    { author:'Tomáš', color:'#ff9f4f', badge:'', text:'Hele, funguje to i bez internetu? 🤔', ts: msAgo(115) },
    { author:'Alex', color:'#4fffb0', badge:'mod', text:'Ano! Vše běží lokálně v prohlížeči. Žádný backend, žádné servery. Prostě otevři HTML soubor a jedeme.', ts: msAgo(113), reactions:[{emoji:'🔥',count:4,active:false},{emoji:'✅',count:3,active:true}] },
    { author:'Kristýna', color:'#ff4f6a', badge:'', text:'Jak přidat kamarády? Nebo to funguje jen jako UI demo?', ts: msAgo(100) },
    { author:'Alex', color:'#4fffb0', badge:'mod', text:'Zatím je to UI demo s plnou funkcionalitou. Markdown, reakce, emoji picker, context menu — vše tu je. Pro síťový chat by bylo potřeba WebSocket server.', ts: msAgo(98) },
    { author:'Pavel', color:'#4fc3ff', badge:'', text:'Tady je příklad kódu:\n`const chat = new NexusChat()\nchat.connect("ws://localhost:8080")`\n\nWebSocket server by zvládl async node.js za 50 řádků.', ts: msAgo(60) },
    { author:'Sara', color:'#c44fff', badge:'', text:'Výkon je fakt skvělý, i na slabém PC to jede plynule. Žádný Electron overhead.', ts: msAgo(40), reactions:[{emoji:'💯',count:2,active:false}] },
    { author:'Tomáš', color:'#ff9f4f', badge:'', text:'Zkus kliknout pravým tlačítkem na zprávu 😏', ts: msAgo(20) },
  ]
};

const MESSAGES = JSON.parse(localStorage.getItem('nx_msgs') || 'null') || JSON.parse(JSON.stringify(SEED_MESSAGES));

let currentServer = 'nexus';
let currentChannel = 'obecny';
let membersVisible = true;
let typingTimer = null;
let isTyping = false;
let searchQuery = '';

const EMOJIS = ['😀','😂','🥹','😎','😍','🤩','🥳','😱','😅','🤔','😴','🤯','💀','🤖','👾',
  '❤️','🔥','✨','💎','⚡','🚀','🎉','🎮','🎵','🏆','👍','👏','🙌','💪','🫡',
  '😊','🤣','😭','😤','🥺','😡','🤗','😏','🙄','😶','🫢','🤫','🥴','😇','👻',
  '🍕','🍺','☕','🍜','🍣','🎂','🍦','🌮','🥑','🍓'];

function msAgo(mins) { return Date.now() - mins * 60000; }

function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('cs-CZ',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
}

// ── RENDER CHANNELS ─────────────────────────────────────────────
function renderChannels() {
  const server = SERVERS[currentServer];
  document.getElementById('server-name').textContent = server.name;
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  for (const cat of server.categories) {
    const catEl = document.createElement('div');
    catEl.className = 'channel-category';
    catEl.innerHTML = `<span class="cat-arrow">▾</span> ${cat.name}`;
    list.appendChild(catEl);
    for (const ch of cat.channels) {
      const el = document.createElement('div');
      el.className = 'channel-item' + (ch.id === currentChannel ? ' active' : '');
      el.dataset.id = ch.id;
      const msgs = MESSAGES[ch.id];
      const unread = msgs && msgs.some(m => !m.read && m.author !== ME.name);
      el.innerHTML = `<span class="ch-icon">${ch.type==='voice'?ch.icon:'#'}</span>
        <span class="ch-name">${ch.name}</span>
        ${unread && ch.id !== currentChannel ? '<span class="ch-unread"></span>' : ''}`;
      el.onclick = () => switchChannel(ch.id, ch.name, ch.desc, ch.icon, ch.type);
      if (ch.type === 'text') el.oncontextmenu = (e) => { e.preventDefault(); showChannelCtx(e, ch); };
      list.appendChild(el);
      // voice participants
      if (ch.type === 'voice' && ch.id === 'vc-lobby') {
        ['Alex','Marina'].forEach((n,i) => {
          const vr = document.createElement('div');
          vr.className = 'voice-row' + (i===0?' speaking':'');
          const col = MEMBERS.find(m=>m.name===n)?.color || '#888';
          vr.innerHTML = `<div class="voice-avatar" style="background:${col}">${n[0]}</div>
            <span class="v-name">${n}</span>
            <span class="v-icon">${i===0?'🔊':'🔇'}</span>`;
          list.appendChild(vr);
        });
      }
    }
  }
}

// ── RENDER MEMBERS ───────────────────────────────────────────────
function renderMembers() {
  const online = MEMBERS.filter(m=>m.status==='online');
  const idle   = MEMBERS.filter(m=>m.status==='idle');
  const dnd    = MEMBERS.filter(m=>m.status==='dnd');
  const offline= MEMBERS.filter(m=>m.status==='offline');
  document.getElementById('member-count').textContent = online.length + idle.length + dnd.length;
  const list = document.getElementById('member-list');
  list.innerHTML = '';
  const groups = [['Online — '+(online.length+idle.length+dnd.length), [...online,...idle,...dnd]], ['Offline — '+offline.length, offline]];
  for (const [label, members] of groups) {
    const cat = document.createElement('div');
    cat.className = 'member-category';
    cat.textContent = label;
    list.appendChild(cat);
    for (const m of members) {
      const el = document.createElement('div');
      el.className = 'member-item';
      el.oncontextmenu = (e) => { e.preventDefault(); showMemberCtx(e, m); };
      el.innerHTML = `
        <div class="member-avatar" style="background:${m.color}">
          ${m.name[0]}
          <div class="m-status m-${m.status}"></div>
        </div>
        <div class="member-info">
          <div class="member-name" style="color:${m.color}">${m.name}</div>
          ${m.activity ? `<div class="member-status">${m.activity}</div>` : ''}
        </div>
        ${m.role ? `<span class="member-role role-${m.role}">${m.role==='admin'?'ADM':'MOD'}</span>` : ''}
      `;
      el.onclick = () => showToast(`${m.name} — ${m.tag}`, 'info');
      list.appendChild(el);
    }
  }
}

// ── RENDER MESSAGES ──────────────────────────────────────────────
function renderMessages(scrollDown = true) {
  const msgs = (MESSAGES[currentChannel] || []).filter(m => {
    if (!searchQuery) return true;
    return m.text.toLowerCase().includes(searchQuery.toLowerCase()) ||
           m.author.toLowerCase().includes(searchQuery.toLowerCase());
  });

  const container = document.getElementById('messages');

  // Build fragment for performance
  const frag = document.createDocumentFragment();

  // Welcome banner
  const banner = document.createElement('div');
  banner.className = 'announce-banner';
  banner.innerHTML = `<strong>#${currentChannel}</strong> — Vítejte v tomto kanálu! NexusChat běží 100% v prohlížeči.`;
  frag.appendChild(banner);

  let prevAuthor = null;
  let prevTs = 0;
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    const samePrev = m.author === prevAuthor && (m.ts - prevTs) < 5 * 60000;

    if (!samePrev && i > 0) {
      // date separator if new day
      const pd = new Date(prevTs), nd = new Date(m.ts);
      if (pd.toDateString() !== nd.toDateString()) {
        const sep = document.createElement('div');
        sep.className = 'system-msg';
        sep.innerHTML = `<span>${nd.toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'})}</span>`;
        frag.appendChild(sep);
      }
    }

    const group = document.createElement('div');
    group.className = 'msg-group';

    const row = document.createElement('div');
    row.className = 'msg-row' + (!samePrev ? ' first-in-group' : '');
    if (m.pinned) row.classList.add('pinned');
    row.dataset.idx = i;
    row.oncontextmenu = (e) => { e.preventDefault(); showMsgCtx(e, i, m); };

    if (!samePrev) {
      const member = MEMBERS.find(mb=>mb.name===m.author) || {};
      const col = m.color || member.color || '#888';
      row.innerHTML = `
        <div class="avatar-wrap">
          <div class="msg-avatar" style="background:${col}" onclick="showToast('${m.author} ${m.tag||''}','info')">${m.author[0]}</div>
        </div>
        <div class="msg-content-wrap">
          <div class="msg-meta">
            <span class="msg-author" style="color:${col}">${m.author}</span>
            ${m.badge ? `<span class="msg-badge badge-${m.badge}">${m.badge}</span>` : ''}
            <span class="msg-ts">${fmtTime(m.ts)}</span>
          </div>
          <div class="msg-text">${formatText(m.text)}</div>
          ${m.reactions ? renderReactions(m.reactions, i) : ''}
          ${m.image ? `<div class="msg-image"><img src="${m.image}" alt="image" loading="lazy" onerror="this.style.display='none'"></div>` : ''}
        </div>
        <div class="msg-actions">${actionBtns(i,m)}</div>
      `;
    } else {
      row.innerHTML = `
        <div class="msg-ts-compact"><span>${fmtTime(m.ts).split(' ')[0]}</span></div>
        <div class="msg-content-wrap">
          <div class="msg-text">${formatText(m.text)}</div>
          ${m.reactions ? renderReactions(m.reactions, i) : ''}
        </div>
        <div class="msg-actions">${actionBtns(i,m)}</div>
      `;
    }

    group.appendChild(row);
    frag.appendChild(group);
    prevAuthor = m.author;
    prevTs = m.ts;
  }

  if (msgs.length === 0 && searchQuery) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:40px;color:var(--text-muted);font-size:13px;';
    empty.textContent = `Žádné výsledky pro "${searchQuery}"`;
    frag.appendChild(empty);
  }

  container.innerHTML = '';
  container.appendChild(frag);

  if (scrollDown) scrollToBottom();
}

function renderReactions(reactions, msgIdx) {
  return `<div class="msg-reactions">${reactions.map((r,ri) =>
    `<span class="reaction${r.active?' active':''}" onclick="toggleReaction(${msgIdx},${ri})">
      <span class="emoji">${r.emoji}</span><span class="count">${r.count}</span>
    </span>`
  ).join('')}</div>`;
}

function actionBtns(idx, m) {
  return `
    <button class="action-btn" title="Reagovat" onclick="addReactionMenu(event,${idx})">😊</button>
    <button class="action-btn" title="Odpovědět" onclick="replyTo(${idx})">↩️</button>
    <button class="action-btn" title="Připnout" onclick="pinMsg(${idx})">📌</button>
    ${m.author === ME.name ? `<button class="action-btn red" title="Smazat" onclick="deleteMsg(${idx})">🗑️</button>` : ''}
  `;
}

function formatText(text) {
  // Escape HTML
  let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Code blocks
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Mentions
  s = s.replace(/@(\w+)/g, '<span class="mention">@$1</span>');
  // Newlines
  s = s.replace(/\n/g, '<br>');
  return s;
}

// ── SEND MESSAGE ─────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  if (!MESSAGES[currentChannel]) MESSAGES[currentChannel] = [];
  MESSAGES[currentChannel].push({
    author: ME.name,
    color: ME.color,
    text,
    ts: Date.now(),
    reactions: []
  });
  saveMessages();

  input.value = '';
  input.style.height = '';
  clearTyping();
  renderMessages(true);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  // update placeholder
  const ch = SERVERS[currentServer]?.categories?.flatMap(c=>c.channels).find(c=>c.id===currentChannel);
  document.getElementById('msg-input').placeholder = `Zpráva do #${ch?.name||currentChannel}`;
}

// ── TYPING INDICATOR ─────────────────────────────────────────────
const TYPERS = ['Alex', 'Marina'];
let typingSimTimer = null;

function handleTyping() {
  if (!isTyping) {
    isTyping = true;
    showTyping([]);
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(clearTyping, 3000);
}

function clearTyping() {
  isTyping = false;
  showTyping(null);
}

function showTyping(names) {
  const bar = document.getElementById('typing-bar');
  if (!names || names.length === 0) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>
    <span class="typing-text"><strong>${names.join(', ')}</strong> ${names.length===1?'píše':'píšou'}...</span>`;
}

// Simulate random typing
function startTypingSimulation() {
  function pick() {
    const count = Math.random() < 0.3 ? 2 : 1;
    const shuffled = [...TYPERS].sort(()=>Math.random()-0.5);
    const typers = shuffled.slice(0, count);
    showTyping(typers);
    setTimeout(() => showTyping(null), 2000 + Math.random() * 2000);
    typingSimTimer = setTimeout(pick, 8000 + Math.random() * 12000);
  }
  typingSimTimer = setTimeout(pick, 4000);
}

// ── REACTIONS ────────────────────────────────────────────────────
function toggleReaction(msgIdx, reactionIdx) {
  const msgs = MESSAGES[currentChannel];
  if (!msgs[msgIdx].reactions) msgs[msgIdx].reactions = [];
  const r = msgs[msgIdx].reactions[reactionIdx];
  if (r.active) { r.count--; r.active = false; if(r.count<=0) msgs[msgIdx].reactions.splice(reactionIdx,1); }
  else { r.count++; r.active = true; }
  saveMessages();
  renderMessages(false);
}

function addReactionMenu(e, msgIdx) {
  e.stopPropagation();
  const common = ['👍','❤️','🔥','😂','😱','🥳','💯','✅'];
  showCtxAt(e.clientX, e.clientY, common.map(em => ({
    icon: em, label: em, action: () => {
      if (!MESSAGES[currentChannel][msgIdx].reactions) MESSAGES[currentChannel][msgIdx].reactions = [];
      const existing = MESSAGES[currentChannel][msgIdx].reactions.find(r=>r.emoji===em);
      if (existing) { existing.count++; existing.active=true; }
      else MESSAGES[currentChannel][msgIdx].reactions.push({emoji:em,count:1,active:true});
      saveMessages(); renderMessages(false);
    }
  })));
}

// ── PINNING / DELETE ─────────────────────────────────────────────
function pinMsg(idx) {
  MESSAGES[currentChannel][idx].pinned = !MESSAGES[currentChannel][idx].pinned;
  saveMessages(); renderMessages(false);
  showToast(MESSAGES[currentChannel][idx].pinned ? 'Zpráva připnuta' : 'Zpráva odepnuta', 'success');
}

function deleteMsg(idx) {
  MESSAGES[currentChannel].splice(idx, 1);
  saveMessages(); renderMessages(false);
  showToast('Zpráva smazána', 'info');
}

function replyTo(idx) {
  const m = MESSAGES[currentChannel][idx];
  const input = document.getElementById('msg-input');
  input.value = `> ${m.author}: ${m.text.substring(0,50)}${m.text.length>50?'…':''}\n`;
  autoResize(input);
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}

// ── SWITCH CHANNEL/SERVER ────────────────────────────────────────
function switchChannel(id, name, desc, icon, type) {
  if (type === 'voice') {
    showToast(`Připojuji k hlasovému kanálu: ${name}`, 'info');
    return;
  }
  currentChannel = id;
  document.getElementById('hdr-title').textContent = name;
  document.getElementById('hdr-desc').textContent = desc || '';
  document.getElementById('hdr-icon').textContent = type === 'voice' ? icon : '#';
  document.getElementById('msg-input').placeholder = `Zpráva do #${name}`;
  if (!MESSAGES[id]) MESSAGES[id] = [];
  renderChannels();
  renderMessages(true);
  clearTimeout(typingSimTimer);
  startTypingSimulation();
}

function switchServer(id, el) {
  document.querySelectorAll('.server-icon').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  currentServer = id;
  const server = SERVERS[id];
  // pick first text channel
  let firstCh = null;
  for (const cat of server.categories) {
    firstCh = cat.channels.find(c=>c.type==='text');
    if (firstCh) break;
  }
  if (firstCh) switchChannel(firstCh.id, firstCh.name, firstCh.desc, firstCh.icon, firstCh.type);
  renderChannels();
  renderMembers();
}

// ── MEMBERS TOGGLE ───────────────────────────────────────────────
function toggleMembers() {
  membersVisible = !membersVisible;
  document.getElementById('members').classList.toggle('hidden', !membersVisible);
  document.getElementById('members-btn').classList.toggle('active', membersVisible);
}

// ── SCROLL ───────────────────────────────────────────────────────
function scrollToBottom(smooth=false) {
  const c = document.getElementById('messages');
  c.scrollTo({ top: c.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
}

function onMessagesScroll() {
  const c = document.getElementById('messages');
  const fromBottom = c.scrollHeight - c.scrollTop - c.clientHeight;
  document.getElementById('scroll-btn').classList.toggle('visible', fromBottom > 200);
}

// ── EMOJI PICKER ─────────────────────────────────────────────────
let emojiOpen = false;
function toggleEmoji() {
  emojiOpen = !emojiOpen;
  document.getElementById('emoji-picker').classList.toggle('open', emojiOpen);
  if (emojiOpen) { renderEmoji(EMOJIS); document.querySelector('.emoji-search').focus(); }
}

function renderEmoji(list) {
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = list.map(e => `<button class="emoji-btn" onclick="insertEmoji('${e}')">${e}</button>`).join('');
}

function filterEmoji(q) {
  // very lightweight filter by index
  if (!q) { renderEmoji(EMOJIS); return; }
  renderEmoji(EMOJIS.filter((_,i)=>String(i).includes(q)));
}

function insertEmoji(e) {
  const input = document.getElementById('msg-input');
  const pos = input.selectionStart;
  input.value = input.value.slice(0,pos) + e + input.value.slice(pos);
  input.focus();
  input.setSelectionRange(pos+e.length, pos+e.length);
  emojiOpen = false;
  document.getElementById('emoji-picker').classList.remove('open');
}

// ── CONTEXT MENUS ────────────────────────────────────────────────
function showCtxAt(x, y, items) {
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = items.map(item => {
    if (item === 'sep') return '<div class="ctx-sep"></div>';
    return `<div class="ctx-item ${item.cls||''}" onclick="(${item.action.toString()})();closeCtx()">
      <span class="ctx-icon">${item.icon||''}</span>${item.label}
    </div>`;
  }).join('');
  menu.style.left = Math.min(x, window.innerWidth-170) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight-200) + 'px';
  menu.classList.add('open');
}

function closeCtx() { document.getElementById('ctx-menu').classList.remove('open'); }

function showMsgCtx(e, idx, m) {
  showCtxAt(e.clientX, e.clientY, [
    { icon:'↩️', label:'Odpovědět', action:()=>replyTo(idx) },
    { icon:'😊', label:'Přidat reakci', action:()=>addReactionMenu(e,idx) },
    { icon:'📌', label: m.pinned?'Odepnout':'Připnout', action:()=>pinMsg(idx) },
    'sep',
    { icon:'📋', label:'Kopírovat text', action:()=>{navigator.clipboard?.writeText(m.text);showToast('Zkopírováno','success');} },
    { icon:'🔗', label:'Kopírovat odkaz', action:()=>showToast('Odkaz zkopírován','success') },
    ...(m.author===ME.name ? ['sep',{ icon:'🗑️', label:'Smazat zprávu', cls:'danger', action:()=>deleteMsg(idx) }] : [])
  ]);
}

function showMemberCtx(e, m) {
  showCtxAt(e.clientX, e.clientY, [
    { icon:'💬', label:'Napsat zprávu', cls:'success', action:()=>showToast(`DM pro ${m.name} — brzy!`,'info') },
    { icon:'🏷️', label:'Zmínit', action:()=>{const i=document.getElementById('msg-input');i.value+=`@${m.name} `;i.focus();} },
    'sep',
    { icon:'🚫', label:'Umlčet', action:()=>showToast(`${m.name} umlčen`,'success') },
    { icon:'👢', label:'Vyhodit', cls:'danger', action:()=>showToast('Potřebuješ admin práva','error') }
  ]);
}

function showChannelCtx(e, ch) {
  showCtxAt(e.clientX, e.clientY, [
    { icon:'📝', label:'Upravit kanál', action:()=>showToast('Jen admin může upravovat','error') },
    { icon:'🔕', label:'Ztlumit kanál', action:()=>showToast(`#${ch.name} ztlumeno`,'success') },
    'sep',
    { icon:'🔗', label:'Kopírovat odkaz', action:()=>showToast('Odkaz zkopírován','success') }
  ]);
}

// ── TOAST ────────────────────────────────────────────────────────
function showToast(msg, type='info') {
  const icons = {success:'✅',error:'❌',info:'ℹ️'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = (icons[type]||'') + ' ' + msg;
  const c = document.getElementById('toast-container');
  c.appendChild(el);
  setTimeout(()=>el.remove(), 3100);
}

// ── MODAL ─────────────────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function openNewServerModal() {
  openModal(`
    <h2>➕ Vytvořit server</h2>
    <div class="field"><label>Název serveru</label><input id="srv-name" placeholder="Můj super server" value=""></div>
    <div class="field"><label>Popis</label><input id="srv-desc" placeholder="O čem je tento server?"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
      <button class="btn btn-primary" onclick="createServer()">Vytvořit</button>
    </div>
  `);
}

function createServer() {
  const name = document.getElementById('srv-name').value.trim();
  if (!name) { showToast('Zadej název serveru','error'); return; }
  closeModal();
  showToast(`Server "${name}" vytvořen! (demo)`, 'success');
}

function openSettings() {
  openModal(`
    <h2>⚙️ Nastavení</h2>
    <div class="field">
      <label>Tvoje přezdívka</label>
      <input id="set-name" value="${ME.name}" placeholder="Přezdívka">
    </div>
    <div class="field">
      <label>Téma</label>
      <select id="set-theme" style="width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--text-primary);font-family:var(--font);outline:none;">
        <option value="dark" selected>Tmavé (výchozí)</option>
        <option value="darker">Super tmavé</option>
      </select>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
      <button class="btn btn-primary" onclick="saveSettings()">Uložit</button>
    </div>
  `);
}

function saveSettings() {
  const name = document.getElementById('set-name').value.trim();
  if (name) {
    ME.name = name;
    localStorage.setItem('nx_name', name);
    document.getElementById('my-uname').textContent = name;
    document.querySelector('#my-avatar').innerHTML = name[0] + '<div class="status-dot m-online"></div>';
  }
  closeModal();
  showToast('Nastavení uloženo','success');
}

// ── MIC/DEAF TOGGLE ─────────────────────────────────────────────
function toggleMic(btn) {
  btn.classList.toggle('active');
  showToast(btn.classList.contains('active') ? 'Mikrofon vypnut' : 'Mikrofon zapnut', 'info');
}
function toggleDeaf(btn) {
  btn.classList.toggle('active');
  showToast(btn.classList.contains('active') ? 'Sluchátka vypnuta' : 'Sluchátka zapnuta', 'info');
}

// ── SEARCH ───────────────────────────────────────────────────────
let searchDebounce = null;
function searchMessages(q) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { searchQuery = q; renderMessages(false); }, 200);
}

// ── SAVE ─────────────────────────────────────────────────────────
function saveMessages() {
  try { localStorage.setItem('nx_msgs', JSON.stringify(MESSAGES)); } catch(e) {}
}

// ── CLOSE OVERLAYS ON OUTSIDE CLICK ─────────────────────────────
document.addEventListener('click', (e) => {
  if (!e.target.closest('#ctx-menu') && !e.target.closest('.msg-row') && !e.target.closest('.member-item')) closeCtx();
  if (!e.target.closest('#emoji-picker') && !e.target.closest('#msg-input') && e.target.id !== 'emoji-btn') {
    document.getElementById('emoji-picker').classList.remove('open');
    emojiOpen = false;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeCtx(); closeModal(); document.getElementById('emoji-picker').classList.remove('open'); }
});

// ── INIT ─────────────────────────────────────────────────────────
(function init() {
  document.getElementById('my-uname').textContent = ME.name;
  document.getElementById('my-avatar').innerHTML = ME.name[0] + '<div class="status-dot m-online"></div>';
  renderChannels();
  renderMembers();
  renderMessages(true);
  startTypingSimulation();

  // Simulate occasional new message
  setTimeout(function sim() {
    if (currentChannel === 'obecny' && Math.random() < 0.5) {
      const bots = [
        { author:'Alex', color:'#4fffb0', texts:['Někdo hraje CS2 dnes večer? 🎮','Nová aktualizace NexusChatů je venku!','@everyone Meetup příští týden 🗓️'] },
        { author:'Marina', color:'#7c6aff', texts:['Tady je hezký song 🎵','Co si myslíte o novém designu?','Kdo chce pizza? 🍕'] },
        { author:'Pavel', color:'#4fc3ff', texts:['`git push --force` pro lamy 😄','Nový PR je na review, mrkněte 👀'] }
      ];
      const bot = bots[Math.floor(Math.random()*bots.length)];
      const text = bot.texts[Math.floor(Math.random()*bot.texts.length)];
      if (!MESSAGES[currentChannel]) MESSAGES[currentChannel] = [];
      MESSAGES[currentChannel].push({ author:bot.author, color:bot.color, text, ts:Date.now(), reactions:[] });
      saveMessages();
      const c = document.getElementById('messages');
      const fromBottom = c.scrollHeight - c.scrollTop - c.clientHeight;
      renderMessages(fromBottom < 100);
    }
    setTimeout(sim, 15000 + Math.random()*20000);
  }, 10000);
})();
</script>
