<html lang="cs">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NexusChat">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c0f">
<meta name="msapplication-navbutton-color" content="#0a0c0f">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;NexusChat&quot;,&quot;short_name&quot;:&quot;NexusChat&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230a0c0f&quot;,&quot;theme_color&quot;:&quot;%230a0c0f&quot;,&quot;orientation&quot;:&quot;any&quot;}">
<title>NexusChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&family=Outfit:wght@400;500;600&family=Raleway:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #0a0c0f; --bg1: #0f1216; --bg2: #151920; --bg3: #1c2029;
  --bg4: #222834; --bg5: #28303e;
  --bd: #1f2836;  --bd2: #273040;
  --acc: #4fffb0; --acc-d: #163d2c;
  --acc2: #7c6aff; --acc2-d: rgba(124,106,255,.13);
  --red: #ff5370; --red-d: rgba(255,83,112,.13);
  --yel: #ffcb6b;
  --t1: #cdd6e0; --t2: #6b7c8f; --t3: #3a4654;
  --r: 7px; --rl: 12px;
  --f: 'Inter', sans-serif;
  --fm: 'IBM Plex Mono', monospace;
  --tr: 100ms ease;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { width: 100%; height: 100%; background: var(--bg0); color: var(--t1); font-family: var(--f); font-size: 14px; overflow: hidden; }
button, input, textarea, select { font-family: var(--f); }

/* ── LAYOUT ── */
#app { display: flex; width: 100%; height: 100%; }

/* ── RAIL ── */
#rail { width: 60px; min-width: 60px; height: 100%; background: var(--bg0); border-right: 1px solid var(--bd); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; overflow-y: auto; scrollbar-width: none; }
#rail::-webkit-scrollbar { display: none; }
#rail-icons { display: flex; flex-direction: column; gap: 4px; align-items: center; width: 100%; }
.si { width: 42px; height: 42px; border-radius: 50%; background: var(--bg3); border: 2px solid transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 500; font-size: 11px; color: var(--t2); transition: border-radius var(--tr), background var(--tr), color var(--tr), border-color var(--tr); position: relative; flex-shrink: 0; user-select: none; }
.si:hover, .si.act { border-radius: var(--r); background: var(--acc-d); color: var(--acc); border-color: var(--acc); }
.rsep { width: 28px; height: 1px; background: var(--bd2); flex-shrink: 0; margin: 2px 0; }
.radd { width: 42px; height: 42px; border-radius: 50%; border: 2px dashed var(--bd2); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--t3); font-size: 20px; transition: all var(--tr); flex-shrink: 0; margin-bottom: 4px; }
.radd:hover { border-color: var(--acc); color: var(--acc); border-radius: var(--r); background: var(--acc-d); }

/* ── CHANNEL PANEL ── */
#chpan { width: 210px; min-width: 210px; height: 100%; background: var(--bg1); border-right: 1px solid var(--bd); display: flex; flex-direction: column; }
#srvhdr { height: 46px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bd); cursor: pointer; flex-shrink: 0; transition: background var(--tr); }
#srvhdr:hover { background: var(--bg3); }
#srvhdr .sn { font-size: 13px; font-weight: 500; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#srvhdr .sa { color: var(--t2); font-size: 11px; flex-shrink: 0; }
#chlist { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; }
#chlist::-webkit-scrollbar { width: 3px; }
#chlist::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }
.chcat { padding: 13px 10px 3px; font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); display: flex; align-items: center; gap: 4px; user-select: none; }
.chcat .cadd { margin-left: auto; font-size: 15px; color: var(--t3); cursor: pointer; opacity: .6; padding: 0 2px; transition: color var(--tr), opacity var(--tr); }
.chcat .cadd:hover { color: var(--acc); opacity: 1; }
.chit { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; margin: 1px 5px; border-radius: var(--r); cursor: pointer; color: var(--t3); font-size: 13px; font-weight: 400; transition: background var(--tr), color var(--tr); user-select: none; }
.chit:hover { background: var(--bg3); color: var(--t2); }
.chit.act { background: var(--bg4); color: var(--t1); }
.chit.vact { background: var(--acc-d); color: var(--acc); }
.chit .chi { font-size: 13px; flex-shrink: 0; opacity: .6; }
.chit .chn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chit .chdot { width: 6px; height: 6px; background: var(--acc); border-radius: 50%; flex-shrink: 0; }
.vmembers { padding: 0 0 4px 26px; }
.vmrow { display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 5px; cursor: pointer; }
.vmrow:hover { background: var(--bg3); }
.vmav { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 500; color: var(--bg0); flex-shrink: 0; }
.vmn { font-size: 11px; color: var(--t2); flex: 1; }
.vmrow.spk .vmn { color: var(--acc); }
.vmrow.spk .vmav { box-shadow: 0 0 0 1.5px var(--acc); }

/* ── USER BAR ── */
#ubar { height: 50px; background: var(--bg0); border-top: 1px solid var(--bd); display: flex; align-items: center; padding: 0 7px; gap: 5px; flex-shrink: 0; }
#myav { width: 30px; height: 30px; border-radius: 50%; background: var(--acc2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--bg0); position: relative; cursor: pointer; flex-shrink: 0; overflow: hidden; }
#myav img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
#myav .sd { position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg0); background: var(--acc); }
#ubar .ui { flex: 1; overflow: hidden; }
#ubar .un { font-size: 12px; font-weight: 500; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
#ubar .ut { font-size: 10px; color: var(--t3); font-family: var(--fm); line-height: 1.3; }
#ubar .ubs { display: flex; gap: 1px; }
.ub { width: 27px; height: 27px; border-radius: 5px; border: none; background: transparent; color: var(--t3); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); }
.ub:hover { background: var(--bg3); color: var(--t1); }
.ub.mut { color: var(--red); }

/* ── MAIN ── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg2); position: relative; }
#chdr { height: 46px; border-bottom: 1px solid var(--bd); display: flex; align-items: center; padding: 0 12px; gap: 8px; background: var(--bg2); flex-shrink: 0; }
#chdr .hi { font-size: 16px; color: var(--t3); }
#chdr .ht { font-size: 13px; font-weight: 500; color: var(--t1); }
#chdr .hd { font-size: 11px; color: var(--t3); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; border-left: 1px solid var(--bd); margin-left: 3px; }
#chdr .hbs { display: flex; gap: 1px; margin-left: auto; }
.hb { width: 28px; height: 28px; border-radius: 5px; border: none; background: transparent; color: var(--t3); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); }
.hb:hover { background: var(--bg3); color: var(--t1); }
.hb.on { color: var(--acc); }
#srch { background: var(--bg3); border: 1px solid var(--bd); border-radius: 5px; padding: 4px 9px; color: var(--t1); font-size: 12px; outline: none; width: 140px; transition: border-color var(--tr), width var(--tr); }
#srch:focus { border-color: var(--acc); width: 180px; }
#srch::placeholder { color: var(--t3); }

/* ── CONN BAR ── */
#connbar { padding: 4px 12px; font-size: 11px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; background: var(--bg1); border-bottom: 1px solid var(--bd); }
#connbar .cdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--yel); }
#connbar.ok .cdot { background: var(--acc); animation: pulse 2s ease infinite; }
#connbar.er .cdot { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
#connbar span { color: var(--t2); font-size: 11px; }
#connbar a { color: var(--acc); cursor: pointer; text-decoration: underline; font-size: 11px; margin-left: auto; }

/* ── VOICE ROOM ── */
#vcroom { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 28px; }
#vcroom.open { display: flex; }
.vc-bar { padding: 5px 14px; border-radius: 20px; background: var(--acc-d); border: 1px solid var(--acc); font-size: 11px; color: var(--acc); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.vc-bar .vp { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); animation: pulse 1.4s ease infinite; }
#vct { font-size: 15px; font-weight: 500; color: var(--t1); }
#vcs { font-size: 12px; color: var(--t2); }
#vcparts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 640px; }
.vcp { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 20px; border-radius: var(--rl); background: var(--bg3); border: 2px solid var(--bd); transition: border-color var(--tr), box-shadow var(--tr); min-width: 90px; }
.vcp.spk { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(79,255,176,.12); }
.vcp.mut { opacity: .5; }
.vcav { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500; color: var(--bg0); position: relative; }
.vcmi { position: absolute; bottom: -2px; right: -2px; width: 17px; height: 17px; border-radius: 50%; background: var(--bg3); border: 2px solid var(--bd); font-size: 9px; display: flex; align-items: center; justify-content: center; }
.vcpn { font-size: 12px; font-weight: 400; color: var(--t2); }
#vcctrls { display: flex; gap: 8px; align-items: center; }
.vcb { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: all var(--tr); background: var(--bg3); color: var(--t1); }
.vcb:hover { background: var(--bg4); }
.vcb.am { background: var(--red-d); color: var(--red); }
.vcb.lv { background: var(--red); color: #fff; width: 50px; height: 50px; }
.vcb.lv:hover { background: #ff6b83; transform: scale(1.05); }
#vcerr { max-width: 360px; text-align: center; }
.verr { background: var(--red-d); border: 1px solid var(--red); border-radius: var(--r); padding: 12px 14px; font-size: 12px; color: var(--red); line-height: 1.6; }

/* ── MESSAGES ── */
#msgs { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 0 0; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; contain: strict; }
@media(max-width:600px) { #msgs { padding-bottom: 54px; } }
#msgs::-webkit-scrollbar { width: 5px; }
#msgs::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }
.sysmsg { display: flex; align-items: center; gap: 7px; padding: 4px 12px; margin: 2px 0; }
.sysmsg::before, .sysmsg::after { content: ''; flex: 1; height: 1px; background: var(--bd); }
.sysmsg span { font-size: 10px; color: var(--t3); white-space: nowrap; padding: 0 5px; }
.welbar { margin: 8px 12px; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--bd2); border-radius: var(--r); font-size: 12px; color: var(--t2); line-height: 1.5; }
.welbar strong { color: var(--acc); font-weight: 500; }
.mr { display: flex; align-items: flex-start; padding: 1px 12px; gap: 10px; position: relative; border-left: 2px solid transparent; transition: background var(--tr); contain: layout; }
.mr:hover { background: var(--bg3); }
.mr.first { padding-top: 8px; }
.mr.pin { border-left-color: var(--yel); }
.avw { width: 34px; flex-shrink: 0; padding-top: 1px; }
.mav { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--bg0); cursor: pointer; flex-shrink: 0; overflow: hidden; }
.mav img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.mav:hover { filter: brightness(1.1); }
.tsc { width: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 2px; opacity: 0; transition: opacity var(--tr); }
.mr:hover .tsc { opacity: 1; }
.tsc span { font-size: 10px; color: var(--t3); font-family: var(--fm); white-space: nowrap; }
.mw { flex: 1; min-width: 0; }
.mmeta { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; }
.mau { font-size: 13px; font-weight: 500; cursor: pointer; }
.mau:hover { text-decoration: underline; }
.mts { font-size: 10px; color: var(--t3); font-family: var(--fm); }
.rbadge { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; letter-spacing: .3px; text-transform: uppercase; flex-shrink: 0; }
.rb-owner { background: rgba(255,203,107,.15); color: var(--yel); }
.rb-admin { background: var(--red-d); color: var(--red); }
.rb-mod { background: var(--acc-d); color: var(--acc); }
.mt { font-size: 13px; line-height: 1.55; color: var(--t1); word-break: break-word; white-space: pre-wrap; user-select: text; font-weight: 400; }
.mt code { font-family: var(--fm); font-size: 12px; background: var(--bg0); border: 1px solid var(--bd); padding: 1px 4px; border-radius: 4px; color: var(--acc); }
.mt .men { color: var(--acc2); background: var(--acc2-d); padding: 0 3px; border-radius: 3px; cursor: pointer; font-weight: 500; }
.mt strong { font-weight: 600; }
.mt em { font-style: italic; color: var(--t2); }
.mrxns { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.rxn { display: flex; align-items: center; gap: 3px; background: var(--bg3); border: 1px solid var(--bd); border-radius: 5px; padding: 2px 7px; cursor: pointer; font-size: 12px; transition: all var(--tr); }
.rxn:hover { background: var(--bg4); border-color: var(--acc); }
.rxn.on { background: var(--acc-d); border-color: var(--acc); }
.rxn .re { font-size: 13px; }
.rxn .rn { font-weight: 500; color: var(--t2); font-size: 11px; font-family: var(--fm); }
.rxn.on .rn { color: var(--acc); }
.macts { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 1px; background: var(--bg3); border: 1px solid var(--bd); border-radius: 5px; padding: 2px; z-index: 10; }
.mr:hover .macts { display: flex; }
.ab { width: 25px; height: 25px; border-radius: 4px; border: none; background: transparent; color: var(--t3); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); }
.ab:hover { background: var(--bg4); color: var(--t1); }
.ab.del:hover { background: var(--red-d); color: var(--red); }
#scbtn { position: absolute; bottom: 70px; right: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--bd); color: var(--t2); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); opacity: 0; pointer-events: none; z-index: 50; }
#scbtn.vis { opacity: 1; pointer-events: auto; }
#scbtn:hover { background: var(--acc); color: var(--bg0); border-color: var(--acc); }

/* ── TYPING ── */
#typbar { height: 19px; padding: 0 12px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.td { display: flex; gap: 3px; align-items: center; }
.td span { width: 4px; height: 4px; border-radius: 50%; background: var(--t3); animation: td 1.2s ease-in-out infinite; }
.td span:nth-child(2) { animation-delay: .2s; }
.td span:nth-child(3) { animation-delay: .4s; }
@keyframes td { 0%,60%,100%{transform:scale(1);opacity:.4} 30%{transform:scale(1.4);opacity:1} }
#typbar .tt { font-size: 11px; color: var(--t3); }
#typbar .tt b { color: var(--t2); font-weight: 500; }

/* ── INPUT ── */
#inpa { padding: 0 10px 10px; flex-shrink: 0; }
#inpbox { background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--rl); display: flex; align-items: flex-end; gap: 5px; padding: 5px 7px; transition: border-color 140ms ease; }
#inpbox:focus-within { border-color: var(--bd2); }
.ib { width: 30px; height: 30px; border-radius: 5px; border: none; background: transparent; color: var(--t3); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); flex-shrink: 0; }
.ib:hover { background: var(--bg4); color: var(--t1); }
#msginp { flex: 1; background: transparent; border: none; outline: none; color: var(--t1); font-size: 13px; resize: none; max-height: 160px; min-height: 20px; line-height: 1.5; padding: 5px 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; user-select: text; font-weight: 400; }
#msginp::placeholder { color: var(--t3); }
#sndbtn { width: 30px; height: 30px; border-radius: 5px; border: none; background: var(--acc); color: var(--bg0); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); flex-shrink: 0; font-weight: 500; }
#sndbtn:hover { background: #5fffb8; transform: scale(1.06); }
#sndbtn:active { transform: scale(.95); }

/* ── MEMBERS ── */
#mbrpan { width: 212px; min-width: 212px; height: 100%; background: var(--bg1); border-left: 1px solid var(--bd); display: flex; flex-direction: column; overflow: hidden; transition: width 180ms ease, min-width 180ms ease, opacity 180ms ease; }
#mbrpan.hid { width: 0; min-width: 0; opacity: 0; }
#mbrhdr { padding: 0 10px; height: 46px; display: flex; align-items: center; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
#mbrhdr span { font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); }
#mbrlist { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 0; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; }
#mbrlist::-webkit-scrollbar { width: 3px; }
#mbrlist::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }
.mcat { padding: 10px 10px 3px; font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); }
.mi { display: flex; align-items: center; gap: 7px; padding: 4px 8px; margin: 0 3px; border-radius: var(--r); cursor: pointer; transition: background var(--tr); }
.mi:hover { background: var(--bg3); }
.mia { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--bg0); position: relative; flex-shrink: 0; overflow: hidden; }
.mia img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.mia .ds { position: absolute; bottom: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--bg1); }
.ds-on { background: #4fffb0; }
.ds-id { background: var(--yel); }
.ds-dn { background: var(--red); }
.ds-of { background: var(--t3); }
.mii { flex: 1; overflow: hidden; }
.min { font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi:hover .min { color: var(--t1); }
.mis { font-size: 10px; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── EMOJI ── */
#emopick { position: fixed; bottom: 74px; background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--rl); padding: 9px; display: none; flex-direction: column; gap: 7px; z-index: 100; box-shadow: 0 8px 28px rgba(0,0,0,.5); width: 280px; }
#emopick.open { display: flex; }
.egrid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; }
.eb { width: 28px; height: 28px; border-radius: 5px; border: none; background: transparent; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background var(--tr); line-height: 1; }
.eb:hover { background: var(--bg4); }
.esrch { background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r); padding: 5px 9px; color: var(--t1); font-size: 12px; outline: none; width: 100%; }
.esrch::placeholder { color: var(--t3); }

/* ── CTX MENU ── */
#ctx { position: fixed; background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--rl); padding: 3px; z-index: 200; display: none; min-width: 156px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
#ctx.open { display: block; }
.cr { display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--t2); transition: all var(--tr); }
.cr:hover { background: var(--bg4); color: var(--t1); }
.cr.dng { color: var(--red); }
.cr.dng:hover { background: var(--red-d); }
.cr.suc { color: var(--acc); }
.cr.suc:hover { background: var(--acc-d); }
.csep { height: 1px; background: var(--bd); margin: 3px 0; }
.ci { font-size: 13px; width: 15px; text-align: center; }

/* ── TOAST ── */
#tsts { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 5px; z-index: 999; pointer-events: none; }
.tst { background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--r); padding: 9px 13px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--t1); box-shadow: 0 4px 16px rgba(0,0,0,.4); animation: tsti .18s ease, tsto .18s ease 2.8s forwards; max-width: 280px; }
.tst.ok { border-left: 3px solid var(--acc); }
.tst.er { border-left: 3px solid var(--red); }
.tst.inf { border-left: 3px solid var(--acc2); }
@keyframes tsti { from{transform:translateX(16px);opacity:0} to{transform:translateX(0);opacity:1} }
@keyframes tsto { from{opacity:1} to{opacity:0} }

/* ── MODAL ── */
#mov { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; }
#mov.open { display: flex; }
#mbox { background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--rl); padding: 20px; width: min(430px, 94vw); max-height: 90vh; overflow-y: auto; box-shadow: 0 14px 44px rgba(0,0,0,.6); animation: mi .16s ease; }
@keyframes mi { from{transform:scale(.96);opacity:0} to{transform:scale(1);opacity:1} }
#mbox h2 { font-size: 15px; font-weight: 500; margin-bottom: 14px; }
.mf { margin-bottom: 12px; }
.mf label { display: block; font-size: 10px; font-weight: 600; letter-spacing: .7px; text-transform: uppercase; color: var(--t3); margin-bottom: 5px; }
.mf input, .mf select, .mf textarea { width: 100%; background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--r); padding: 7px 9px; color: var(--t1); font-size: 13px; outline: none; transition: border-color var(--tr); font-weight: 400; }
.mf input:focus, .mf select:focus, .mf textarea:focus { border-color: var(--acc); }
.mf select option { background: var(--bg2); }
.mbtns { display: flex; gap: 7px; justify-content: flex-end; margin-top: 16px; }
.mbtn { padding: 7px 16px; border-radius: var(--r); border: none; font-size: 12px; font-weight: 500; cursor: pointer; transition: opacity var(--tr); }
.mbtn:hover { opacity: .85; }
.mbtn-p { background: var(--acc); color: var(--bg0); }
.mbtn-g { background: var(--bg4); color: var(--t2); }
.ibox { background: var(--bg2); border: 1px solid var(--bd2); border-radius: var(--r); padding: 10px 12px; font-size: 12px; color: var(--t2); line-height: 1.7; margin-top: 6px; }
.ibox strong { color: var(--t1); font-weight: 500; }
.ibox code { font-family: var(--fm); font-size: 11px; background: var(--bg0); padding: 1px 4px; border-radius: 3px; color: var(--acc); }
.ibox a { color: var(--acc); cursor: pointer; }

/* ── PROFILE OVERLAY ── */
#profov { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(5px); z-index: 700; display: none; align-items: center; justify-content: center; }
#profov.open { display: flex; }
#profpanel { width: min(680px, 96vw); height: min(540px, 94vh); background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--rl); display: flex; overflow: hidden; margin: auto; box-shadow: 0 24px 70px rgba(0,0,0,.75); animation: mi .18s ease; position: relative; }
#proftabs { width: 180px; min-width: 180px; background: var(--bg1); border-right: 1px solid var(--bd); display: flex; flex-direction: column; padding: 10px 0; overflow-y: auto; flex-shrink: 0; }
#proftabs .ph { padding: 14px 14px 4px; font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); }
.ptab { display: flex; align-items: center; gap: 8px; padding: 7px 12px; margin: 1px 6px; border-radius: var(--r); cursor: pointer; font-size: 13px; color: var(--t2); transition: all var(--tr); }
.ptab:hover { background: var(--bg3); color: var(--t1); }
.ptab.act { background: var(--bg4); color: var(--t1); }
.ptab-ico { font-size: 14px; width: 18px; text-align: center; }
.ptab-sep { height: 1px; background: var(--bd); margin: 8px 10px; }
#profcontent { flex: 1; overflow-y: auto; padding: 22px 24px; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; }
#profcontent::-webkit-scrollbar { width: 4px; }
#profcontent::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }
#profclose { position: absolute; top: 12px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg4); color: var(--t2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); z-index: 10; }
#profclose:hover { background: var(--red-d); color: var(--red); }
.ptitle { font-size: 16px; font-weight: 500; color: var(--t1); padding-bottom: 12px; border-bottom: 1px solid var(--bd); margin-bottom: 16px; }
.psec { margin-bottom: 18px; }
.psec h3 { font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); margin-bottom: 8px; }
.pinp { background: var(--bg0); border: 1px solid var(--bd); border-radius: var(--r); padding: 8px 10px; color: var(--t1); font-size: 13px; outline: none; transition: border-color var(--tr); width: 100%; font-family: var(--f); }
.pinp:focus { border-color: var(--acc); }
/* preview */
.npw { background: var(--bg3); border: 1px solid var(--bd); border-radius: var(--r); padding: 12px; display: flex; align-items: flex-start; gap: 10px; }
.npwav { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; overflow: hidden; }
.npwav img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.npwb { flex: 1; }
.npwm { display: flex; align-items: baseline; gap: 6px; margin-bottom: 3px; }
.npwn { font-size: 13px; font-weight: 500; }
.npwt { font-size: 10px; color: var(--t3); font-family: var(--fm); }
.npwtxt { font-size: 13px; color: var(--t1); line-height: 1.5; }
/* colors */
.cpal { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.csw { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform var(--tr), border-color var(--tr); }
.csw:hover { transform: scale(1.15); }
.csw.sel { border-color: #fff; transform: scale(1.1); }
.ccustom { width: 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--bd2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--t3); transition: all var(--tr); }
.ccustom:hover { border-color: var(--acc); color: var(--acc); }
/* font grid */
.fgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.foption { padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--bd); background: var(--bg3); cursor: pointer; transition: all var(--tr); }
.foption:hover { background: var(--bg4); border-color: var(--bd2); }
.foption.sel { border-color: var(--acc); background: var(--acc-d); }
.foption .fn { font-size: 10px; color: var(--t3); margin-bottom: 2px; }
.foption .fp { font-size: 14px; color: var(--t1); }
/* avatar upload */
.avwrap { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.avprev { width: 68px; height: 68px; border-radius: 50%; background: var(--bg3); border: 3px solid var(--bd); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500; color: var(--bg0); overflow: hidden; position: relative; cursor: pointer; transition: border-color var(--tr); flex-shrink: 0; }
.avprev:hover { border-color: var(--acc); }
.avprev img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.avinfo p { font-size: 12px; color: var(--t2); line-height: 1.6; margin-bottom: 6px; }
.avbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.avbtn { padding: 5px 11px; border-radius: var(--r); border: 1px solid var(--bd); background: var(--bg3); color: var(--t2); font-size: 12px; cursor: pointer; transition: all var(--tr); }
.avbtn:hover { background: var(--bg4); color: var(--t1); }
.avbtn.p { background: var(--acc); color: var(--bg0); border-color: var(--acc); }
.avbtn.p:hover { background: #5fffb8; }
.avbtn.d { color: var(--red); border-color: transparent; }
.avbtn.d:hover { background: var(--red-d); }
/* emoji icons grid */
.eigrid { display: flex; flex-wrap: wrap; gap: 6px; }
.eiopt { width: 36px; height: 36px; border-radius: 7px; background: var(--bg3); border: 1px solid var(--bd); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; transition: all var(--tr); }
.eiopt:hover { background: var(--bg4); border-color: var(--acc); }
/* status */
.stgrid { display: flex; flex-direction: column; gap: 5px; }
.stopt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--bd); background: var(--bg3); cursor: pointer; transition: all var(--tr); }
.stopt:hover { background: var(--bg4); }
.stopt.sel { border-color: var(--acc); background: var(--acc-d); }
.stopt .sdot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.stopt .slbl { font-size: 13px; color: var(--t1); flex: 1; }
.stopt .sdsc { font-size: 11px; color: var(--t3); }

/* ── SERVER SETTINGS OVERLAY ── */
#ssov { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(5px); z-index: 600; display: none; align-items: center; justify-content: center; }
#ssov.open { display: flex; }
#sspanel { width: min(760px, 98vw); height: min(580px, 96vh); background: var(--bg2); border: 1px solid var(--bd); border-radius: var(--rl); display: flex; overflow: hidden; margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,.7); animation: mi .18s ease; position: relative; }
#sstabs { width: 196px; min-width: 196px; background: var(--bg1); border-right: 1px solid var(--bd); display: flex; flex-direction: column; padding: 10px 0; overflow-y: auto; flex-shrink: 0; }
#sstabs .sh { padding: 14px 14px 4px; font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); }
.stab { display: flex; align-items: center; gap: 8px; padding: 7px 12px; margin: 1px 6px; border-radius: var(--r); cursor: pointer; font-size: 13px; color: var(--t2); transition: all var(--tr); }
.stab:hover { background: var(--bg3); color: var(--t1); }
.stab.act { background: var(--bg4); color: var(--t1); }
.stab-ico { font-size: 14px; width: 18px; text-align: center; }
.stab-sep { height: 1px; background: var(--bd); margin: 8px 10px; }
.stab.dng { color: var(--red); }
.stab.dng:hover { background: var(--red-d); }
#sscont { flex: 1; overflow-y: auto; padding: 22px 26px; scrollbar-width: thin; scrollbar-color: var(--bg5) transparent; }
#sscont::-webkit-scrollbar { width: 4px; }
#sscont::-webkit-scrollbar-thumb { background: var(--bg5); border-radius: 3px; }
#ssclose { position: absolute; top: 12px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg4); color: var(--t2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--tr); z-index: 10; }
#ssclose:hover { background: var(--red-d); color: var(--red); }
.sstitle { font-size: 17px; font-weight: 500; color: var(--t1); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--bd); }
.sssec { margin-bottom: 22px; }
.sssec h3 { font-size: 10px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--t3); margin-bottom: 9px; }
.ssrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bd); }
.ssrow:last-child { border-bottom: none; }
.ssrow .sri { flex: 1; }
.ssrow .srn { font-size: 13px; color: var(--t1); }
.ssrow .srd { font-size: 11px; color: var(--t3); margin-top: 2px; }
.ssbtn { padding: 5px 12px; border-radius: var(--r); border: 1px solid var(--bd); background: var(--bg3); color: var(--t2); font-size: 12px; cursor: pointer; transition: all var(--tr); white-space: nowrap; }
.ssbtn:hover { background: var(--bg4); color: var(--t1); }
.ssbtn.p { background: var(--acc); color: var(--bg0); border-color: var(--acc); }
.ssbtn.p:hover { background: #5fffb8; }
.ssbtn.d { color: var(--red); border-color: var(--red-d); }
.ssbtn.d:hover { background: var(--red-d); }
.ssinp { background: var(--bg0); border: 1px solid var(--bd); border-radius: var(--r); padding: 7px 10px; color: var(--t1); font-size: 13px; outline: none; transition: border-color var(--tr); font-family: var(--f); }
.ssinp:focus { border-color: var(--acc); }
.chrow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r); background: var(--bg3); border: 1px solid var(--bd); margin-bottom: 5px; }
.chrow .chico { font-size: 13px; color: var(--t3); }
.chrow .chnm { flex: 1; font-size: 13px; color: var(--t1); }
.chrow .chtp { font-size: 10px; color: var(--t3); background: var(--bg4); padding: 1px 5px; border-radius: 3px; }
.chrow .chbtns { display: flex; gap: 4px; }
.rolerow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); background: var(--bg3); border: 1px solid var(--bd); margin-bottom: 5px; }
.rdot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.rname { flex: 1; font-size: 13px; color: var(--t1); }
.rcnt { font-size: 11px; color: var(--t3); font-family: var(--fm); }
.mrow { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: var(--r); background: var(--bg3); border: 1px solid var(--bd); margin-bottom: 5px; }
.mrav { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; color: var(--bg0); flex-shrink: 0; }
.mrinfo { flex: 1; overflow: hidden; }
.mrname { font-size: 13px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrtag { font-size: 10px; color: var(--t3); font-family: var(--fm); }

/* ── TABLET ── */

/* ── TABLET ── */
@media(max-width: 768px) {
  #rail { width: 50px; min-width: 50px; }
  #chpan { width: 170px; min-width: 170px; }
  #mbrpan { display: none; }
  #chdr .hd { display: none; }
  #sstabs { width: 150px; min-width: 150px; }
  #proftabs { width: 140px; min-width: 140px; }
}

/* ── BOTTOM NAV (default hidden, shown on mobile) ── */
#mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 54px;
  background: var(--bg1);
  border-top: 1px solid var(--bd);
  z-index: 400;
  align-items: stretch;
  justify-content: space-around;
}
.mnav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  background: transparent; border: none; color: var(--t3);
  cursor: pointer; transition: color var(--tr); padding: 4px 0;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.mnav-btn:active { background: var(--bg3); }
.mnav-btn.act { color: var(--acc); }
.mnav-btn .mni { font-size: 20px; line-height: 1; }
.mnav-btn .mnl { font-size: 9px; font-weight: 500; letter-spacing: .3px; }

/* ── MOBILE DRAWER ── */
#mob-drawer { position: fixed; inset: 0; z-index: 350; display: none; }
#mob-drawer.open { display: block; }
#mob-drawer-bg { position: absolute; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); }
#mob-sidebar {
  position: absolute; top: 0; left: 0;
  width: 280px; max-width: 85vw; height: 100%;
  background: var(--bg1); display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform 260ms cubic-bezier(.4,0,.2,1);
  padding-top: env(safe-area-inset-top);
}
#mob-drawer.open #mob-sidebar { transform: translateX(0); }
#mob-sidebar-header {
  height: 52px; display: flex; align-items: center;
  padding: 0 14px; gap: 10px; border-bottom: 1px solid var(--bd); flex-shrink: 0;
}
#mob-sidebar-header .msrv-name { font-size: 14px; font-weight: 500; color: var(--t1); flex: 1; }
#mob-sidebar-header .msrv-set { width: 30px; height: 30px; border-radius: 6px; border: none; background: transparent; color: var(--t2); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#mob-sidebar-header .msrv-set:active { background: var(--bg3); }
#mob-chlist { flex: 1; overflow-y: auto; padding: 6px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#mob-chlist::-webkit-scrollbar { display: none; }
#mob-srv-rail {
  display: flex; flex-direction: row; gap: 6px;
  padding: 8px 12px; border-top: 1px solid var(--bd);
  overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
}
#mob-srv-rail::-webkit-scrollbar { display: none; }
.mob-si {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg3); border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 10px; font-weight: 500; color: var(--t2); flex-shrink: 0;
  transition: all var(--tr);
}
.mob-si:active, .mob-si.act { background: var(--acc-d); color: var(--acc); border-color: var(--acc); border-radius: var(--r); }
.mob-si-add {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px dashed var(--bd2); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--t3); font-size: 18px; flex-shrink: 0;
}
.mob-si-add:active { border-color: var(--acc); color: var(--acc); }
#mob-ubar {
  height: 52px; background: var(--bg0); border-top: 1px solid var(--bd);
  display: flex; align-items: center; padding: 0 10px; gap: 8px; flex-shrink: 0;
}
#mob-av {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; color: var(--bg0);
  position: relative; cursor: pointer; flex-shrink: 0; overflow: hidden;
}
#mob-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
#mob-av .sdot { position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg0); background: var(--acc); }
#mob-ubar .mun { font-size: 13px; font-weight: 500; color: var(--t1); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mob-ubar .mubtns { display: flex; gap: 2px; }
.mubtn { width: 32px; height: 32px; border-radius: 6px; border: none; background: transparent; color: var(--t3); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.mubtn:active { background: var(--bg3); color: var(--t1); }
.mubtn.mut { color: var(--red); }

/* ── MOBILE (≤600px) ── */
@media(max-width: 600px) {
  /* Safe area insets */
  #app { padding-top: env(safe-area-inset-top); }

  /* Hide desktop sidebars */
  #rail { display: none; }
  #chpan { display: none; }
  #mbrpan { display: none; }
  #chdr .hd { display: none; }

  /* Show bottom nav */
  #mobile-nav { display: flex; }

  /* Bigger touch targets */
  .hb { width: 36px; height: 36px; font-size: 16px; }
  #srch { width: 120px; }
  #srch:focus { width: 150px; }

  /* Messages */
  .mt { font-size: 14px; line-height: 1.6; }
  .mau { font-size: 14px; }
  .mav { width: 36px; height: 36px; }
  .avw { width: 36px; }
  .mr { padding: 1px 10px; gap: 9px; }
  .mr.first { padding-top: 9px; }
  #msgs { padding-bottom: 60px; }

  /* Input */
  #inpa { padding: 0 8px 8px; }
  #msginp { font-size: 16px; }
  #sndbtn { width: 36px; height: 36px; font-size: 16px; }
  .ib { width: 34px; height: 34px; font-size: 18px; }
  #inpbox { padding: 6px 8px; border-radius: 16px; }

  /* Conn bar */
  #connbar { padding: 3px 10px; font-size: 10px; }
  #connbar a { font-size: 10px; }

  /* Header */
  #chdr { height: 48px; padding: 0 10px; gap: 6px; }
  #chdr .ht { font-size: 14px; }

  /* Modals */
  #mov { align-items: flex-end; }
  #mbox { width: 100% !important; max-height: 85vh; border-radius: var(--rl) var(--rl) 0 0; padding: 20px 18px 28px; }

  /* Profile/SS panels full screen */
  #profpanel, #sspanel { width: 100vw !important; height: 100vh !important; max-height: 100vh; border-radius: 0 !important; flex-direction: column; }
